name: OTTOSSOM
options:
  bundleIdPrefix: app.mossling
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OTTOSSOM:
    type: application
    platform: iOS
    sources:
      - path: Game
        excludes: ["Resources/rooms.json", "Resources/story.json", "Resources/rpg.json"]
      - path: Game/Resources/rooms.json
        buildPhase: resources
      - path: Game/Resources/rpg.json
        buildPhase: resources
      - path: Game/Resources/story.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mossling.game
        PRODUCT_NAME: OTTOSSOM
        INFOPLIST_FILE: Game/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  OTTOSSOMTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GameTests]
    dependencies:
      - target: OTTOSSOM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OTTOSSOM.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OTTOSSOM"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OTTOSSOM:
    build:
      targets:
        OTTOSSOM: all
        OTTOSSOMTests: [test]
    test:
      targets: [OTTOSSOMTests]
